# Database configuration
# Uses H2 by default so the app runs locally without external setup.
# Override with environment variables when using MySQL or another database.
# Aiven MySQL database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# Server
server.port=${PORT:8081}

# Comma-separated browser origins allowed to call this API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://campus-skill-exchange-frontend-7x9h.vercel.app}

# Security
spring.security.user.name=admin
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:admin}

